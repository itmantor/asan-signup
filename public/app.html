<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>پنل کاربری | آسان — پلتفرم خدمات مالی</title>
  <meta name="theme-color" content="#0e225b">
  <link rel="icon" href="/favicon.png">
  <link rel="preload" href="/fonts/vazirmatn-arabic-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand on-dark" href="/app" data-route>
        <img src="/img/logo-mark-light.png" alt="">
        <div><div class="brand-name">آسان</div><div class="brand-sub">پلتفرم خدمات مالی</div></div>
      </a>
      <nav id="nav"></nav>
      <div class="sidebar-user">
        <div class="avatar" id="avatar"></div>
        <div style="min-width:0">
          <div class="u-name" id="u-name"></div>
          <div class="u-mobile ltr" id="u-mobile"></div>
        </div>
        <button class="logout" id="logout" title="خروج" aria-label="خروج" data-icon="logout"></button>
      </div>
    </aside>
    <div class="nav-scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="منو" data-icon="menu" data-size="24"></button>
        <h1 id="title">داشبورد</h1>
        <a class="wallet-pill" href="/app/wallet" data-route><span data-icon="wallet" data-size="18"></span><span id="pill-balance">۰ تومان</span></a>
      </header>
      <main class="content" id="view"><div class="loading">در حال بارگذاری…</div></main>
      <footer class="app-footer">
        <span>© <span data-year></span> <span data-seller="name"></span></span>
        <a href="/about">درباره ما</a>
        <a href="/contact">تماس با ما</a>
        <a href="/terms">قوانین و مقررات</a>
        <span class="enamad" data-enamad></span>
      </footer>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
