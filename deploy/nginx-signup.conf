# /etc/nginx/sites-available/asan-signup
# HTTPS is handled by ArvanCloud CDN in front of the server; Arvan forwards the
# visitor's real IP in the "ar-real-ip" header, which passes through to the app.
server {
    listen 80;
    listen [::]:80;
    server_name signup.asanfsp.ir;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
