# /etc/nginx/sites-available/asan-signup
#
# ArvanCloud CDN sits in front of signup.asanfsp.ir: visitors get Arvan's certificate,
# and Arvan connects to this server over HTTPS (port 443). The certificate below is only
# for that Arvan → server hop, so the existing asanfsp.ir certificate on this server is
# reused. Arvan forwards the visitor's real IP in the "ar-real-ip" header.

server {
    listen 80;
    listen [::]:80;
    server_name signup.asanfsp.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name signup.asanfsp.ir;

    ssl_certificate     /etc/letsencrypt/live/asanfsp.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asanfsp.ir/privkey.pem;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
